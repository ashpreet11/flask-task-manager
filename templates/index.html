<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flask Task Manager</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Flask Task Manager</h1>

        <form action="/add" method="POST">
            <input
                type="text"
                name="task"
                placeholder="Enter a task"
                required
            >

            <button type="submit">Add Task</button>
        </form>

        <div class="tasks">

            {% for task in tasks %}

                <div class="task">

                    {% if task.completed %}
                        <span class="completed">
                            {{ task.name }}
                        </span>
                    {% else %}
                        <span>
                            {{ task.name }}
                        </span>
                    {% endif %}

                    <div>
                        {% if not task.completed %}
                            <a href="/complete/{{ loop.index0 }}">
                                Complete
                            </a>
                        {% endif %}

                        <a href="/delete/{{ loop.index0 }}">
                            Delete
                        </a>
                    </div>

                </div>

            {% else %}

                <p>No tasks yet. Add your first task!</p>

            {% endfor %}

        </div>

    </div>

</body>
</html>
